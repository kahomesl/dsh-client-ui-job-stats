name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      # The committed lockfile is the contract: a dependency change that was not
      # installed locally fails here instead of drifting.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Syntax check the browser half
        run: node --check client/client.js

      - name: Run the spec suite
        run: pnpm test
